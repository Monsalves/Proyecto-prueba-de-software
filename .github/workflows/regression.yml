name: Bus de Objetos Regresion (Etapa 5)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # pytest ejecuta la suite y pytest-json-report genera el archivo
          # que luego se transforma en el reporte publicado en GitHub Issues.
          pip install pytest pytest-json-report

      - name: Ejecutar Regresion
        run: |
          # El JSON no se guarda como artifact: solo se usa como insumo
          # temporal para construir el cuerpo del issue con el resumen.
          PYTHONPATH=. pytest -m regression --tb=short --json-report --json-report-file=report_regresion.json

      - name: Publicar Resultados de Regresion en GitHub Issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El script usa este archivo para distinguir el reporte de regresion
          # del reporte de la suite completa.
          REPORT_FILE: report_regresion.json
        run: |
          # Publica el resumen final en un issue
