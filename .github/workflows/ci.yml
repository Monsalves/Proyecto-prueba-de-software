name: Bus de Objetos CI (Etapa 2)

on: [push, pull_request]

permissions:
  contents: read
  issues: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html pytest-json-report

    - name: Ejecutar Todas las Pruebas y Generar Reporte
      run: |
        PYTHONPATH=. pytest tests/ --html=reporte_tests.html --self-contained-html --json-report --json-report-file=report.json

    - name: Subir Reporte HTML
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reporte-tests-html
        path: reporte_tests.html

    - name: Publicar Resultados en GitHub Issues
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scripts/publish_test_results.py
